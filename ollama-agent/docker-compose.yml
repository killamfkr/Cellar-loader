services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    # Uncomment for NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    restart: unless-stopped

  agent:
    build: ./agent
    container_name: ollama-cursor-agent
    depends_on:
      - ollama
    environment:
      AGENT_OLLAMA_BASE_URL: http://ollama:11434
      AGENT_DEFAULT_MODEL: ${AGENT_DEFAULT_MODEL:-qwen2.5-coder:7b}
      AGENT_WORKSPACE_ROOT: /workspace
      AGENT_MAX_AGENT_STEPS: ${AGENT_MAX_AGENT_STEPS:-40}
      AGENT_GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AGENT_GITHUB_REPO: ${GITHUB_REPO:-}
      AGENT_GITHUB_DEFAULT_BRANCH: ${GITHUB_DEFAULT_BRANCH:-main}
      AGENT_GITHUB_BRANCH_PREFIX: ${GITHUB_BRANCH_PREFIX:-cursor/}
      AGENT_GITHUB_BRANCH_SUFFIX: ${GITHUB_BRANCH_SUFFIX:-local}
      AGENT_GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      AGENT_GITHUB_TRIGGER_LABEL: ${GITHUB_TRIGGER_LABEL:-agent}
      AGENT_GITHUB_COMMENT_TRIGGER: ${GITHUB_COMMENT_TRIGGER:-@agent}
      AGENT_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      # Mount the project(s) the agent should edit:
      - ${AGENT_WORKSPACE:-../}:/workspace
    ports:
      - "${AGENT_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  ollama_data:
